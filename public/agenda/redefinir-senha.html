<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova senha — Barbearia Sir. Patrick</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0B">

<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%230A0A0B'/%3E%3Cg%20fill='none'%20stroke='%23C9A961'%20stroke-width='1.8'%20stroke-linecap='round'%3E%3Ccircle%20cx='9.5'%20cy='23'%20r='3.1'/%3E%3Ccircle%20cx='22.5'%20cy='23'%20r='3.1'/%3E%3Cpath%20d='M20.8%205.5%2011.6%2020.6M11.2%205.5l9.2%2015.1'/%3E%3C/g%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap">

<link rel="stylesheet" href="/shared/tokens.css">
<link rel="stylesheet" href="/shared/escuro.css">
<link rel="stylesheet" href="/agenda/agenda.css">
</head>
<body>

<main class="porta">
  <div class="porta-caixa">

    <a class="porta-marca" href="/">
      <span class="marca-nome">Sir. Patrick</span>
      <span class="marca-kicker">BARBEARIA</span>
    </a>

    <section class="painel">
      <h1 style="font-size:26px;margin-bottom:8px">Criar uma <em>senha nova</em></h1>
      <p class="texto-apoio" style="margin-bottom:20px">
        Escolha a senha que você vai usar daqui para a frente.
      </p>

      <p class="aviso" id="aviso" hidden></p>

      <form id="form-senha" novalidate>
        <label class="campo">
          <span>Nova senha</span>
          <input type="password" name="senha" autocomplete="new-password" required minlength="6">
          <span class="campo-dica">Pelo menos 6 caracteres.</span>
        </label>

        <label class="campo">
          <span>Repita a senha</span>
          <input type="password" name="senha2" autocomplete="new-password" required minlength="6">
        </label>

        <button class="btn btn-gold btn-bloco" type="submit">Salvar a nova senha</button>
      </form>
    </section>

    <p class="porta-rodape" style="margin-top:22px">
      <a href="/agenda/entrar.html" style="text-decoration:none;border-bottom:1px solid var(--line)">Voltar para entrar</a>
    </p>

  </div>
</main>

<script type="module" src="/agenda/redefinir-senha.js"></script>
</body>
</html>
